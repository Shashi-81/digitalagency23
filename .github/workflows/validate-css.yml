name: Validate CSS

on:
  push:
  pull_request:

jobs:
  validate-css:
    name: Run CSS validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CSS validation
        run: bun run validate:css
